name: Validate optional split input
on:
  push:
    branches: [codex/validate-optional-split]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 27d7d6890cb8bfa7ed5cda2f2656f82b6af0736a
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test and lint dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Build baseline from source
        run: python -m pip install -e . -v
      - name: Add regression tests
        run: |
          python -c "import base64;open('/tmp/split.patch','wb').write(base64.b64decode(''))"
          git apply --include=tests/python/shape_inference_test.py /tmp/split.patch
      - name: Confirm baseline regression
        run: |
          set +e
          python -m pytest tests/python/shape_inference_test.py -k 'split_to_sequence_keepdims or split_to_sequence_not_keepdims' -q > /tmp/baseline.txt 2>&1
          result=$?
          cat /tmp/baseline.txt
          test "$result" -eq 1
          grep -q 'FAILED.*split_to_sequence' /tmp/baseline.txt
      - name: Apply fix and rebuild
        run: |
          git apply --include=onnx/defs/sequence/utils.cc /tmp/split.patch
          python -m pip install -e . -v
      - name: Run shape inference tests
        run: python -m pytest tests/python/shape_inference_test.py tests/python/node_shape_inference_test.py tests/python/split_shape_inference_test.py -q
      - name: Lint changed files
        run: |
          lintrunner init
          lintrunner onnx/defs/sequence/utils.cc tests/python/shape_inference_test.py
