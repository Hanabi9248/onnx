name: Validate optional split lint
on:
  push:
    branches: [codex/validate-optional-split]
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 27d7d6890cb8bfa7ed5cda2f2656f82b6af0736a
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply validated fix with test formatting correction
        run: |
          python -c "import base64;open('/tmp/split.patch','wb').write(base64.b64decode(''))"
          git apply /tmp/split.patch
          git diff --check
      - name: Lint changed files
        run: |
          python -m pip install lintrunner -r requirements-lintrunner.txt
          lintrunner init
          lintrunner onnx/defs/sequence/utils.cc tests/python/shape_inference_test.py
